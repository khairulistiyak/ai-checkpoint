<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F15" />
      <stop offset="100%" stop-color="#020304" />
    </linearGradient>

    <!-- Colors -->
    <linearGradient id="orangeRed" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E54" />
      <stop offset="50%" stop-color="#FF5B00" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0A65DF" />
    </linearGradient>

    <!-- Glowing Filters for Groups -->
    <filter id="glowGroup" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Simple Blurs -->
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="16" />

  <g transform="translate(0, -20)">
    <!-- LEFT ARROW (Glitch / Broken) -->
    <g fill="url(#orangeRed)" filter="url(#glowGroup)">
      <!-- Main solid shape for the chevron -->
      <path d="M 310 140 L 190 250 L 310 360 L 280 360 L 160 250 L 280 140 Z" />
      
      <!-- Abstract Glitch Shapes (Horizontal fragments to convey breakdown) -->
      <path d="M 280 120 L 260 120 L 240 140 L 260 140 Z" />
      <path d="M 250 160 L 200 160 L 180 180 L 230 180 Z" />
      <rect x="250" y="145" width="25" height="4" />
      <rect x="290" y="130" width="15" height="6" />
      <rect x="210" y="185" width="18" height="4" />
      <rect x="180" y="200" width="30" height="3" />
      
      <rect x="130" y="235" width="22" height="6" />
      <rect x="110" y="248" width="40" height="4" />
      <rect x="150" y="260" width="25" height="8" />
      <rect x="125" y="275" width="15" height="5" />
      
      <rect x="195" y="295" width="35" height="4" />
      <rect x="220" y="315" width="20" height="6" />
      <rect x="245" y="340" width="30" height="5" />
      <rect x="260" y="365" width="18" height="4" />
      <rect x="280" y="375" width="10" height="3" />

      <!-- Floating pixels -->
      <rect x="170" y="210" width="4" height="4" />
      <rect x="140" y="225" width="3" height="3" />
      <rect x="220" y="280" width="5" height="5" />
      <rect x="280" y="180" width="4" height="4" />
      <rect x="300" y="210" width="6" height="6" />
      <rect x="280" y="290" width="4" height="4" />
      <rect x="170" y="320" width="3" height="3" />
      <rect x="190" y="340" width="5" height="5" />
    </g>

    <!-- RIGHT ARROW (Clean / Glowing) -->
    <g filter="url(#glowGroup)">
      <path d="M 490 140 L 610 250 L 490 360 L 520 360 L 640 250 L 520 140 Z" fill="url(#cyanBlue)" />
    </g>

    <!-- CENTER NODE (Core / Intelligence) -->
    <!-- Subtle connection line -->
    <line x1="330" y1="250" x2="470" y2="250" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Outer Glow -->
    <circle cx="400" cy="250" r="35" fill="#00F2FE" opacity="0.12" filter="url(#blur20)" />
    <!-- Inner Glow -->
    <circle cx="400" cy="250" r="22" fill="#FFFFFF" opacity="0.3" filter="url(#blur8)" />
    <!-- Core -->
    <circle cx="400" cy="250" r="13" fill="#FFFFFF" />
  </g>

  <!-- TEXT -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="400" y="460" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="3">CODE<tspan font-weight="300" fill="#E2E8F0"> RESTORE</tspan></text>
    
    <!-- Subtitle -->
    <text x="400" y="500" font-size="16" font-weight="500" fill="#8B949E" letter-spacing="8">SMART AI CODE CORRECTION</text>
  </g>
</svg>
