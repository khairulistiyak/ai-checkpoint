<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101012" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>

    <!-- Primary Accent Gradient (Sky Blue) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Clean Silver Gradient -->
    <linearGradient id="silver-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark App Icon Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="510" height="510" x="1" y="1" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Outer Ring (The "C" for Checkpoint) -->
  <path d="M370 170 A160 160 0 1 0 370 342" fill="none" stroke="url(#silver-grad)" stroke-width="36" stroke-linecap="round" />

  <!-- The "A" shape (AI) -->
  <path d="M256 120 L156 360 M256 120 L356 360" fill="none" stroke="url(#accent-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Checkmark instead of crossbar -->
  <path d="M190 280 L240 330 L350 200" fill="none" stroke="url(#accent-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Checkpoint Node at the peak of A -->
  <circle cx="256" cy="120" r="24" fill="#38bdf8" filter="url(#soft-glow)" />
</svg>
