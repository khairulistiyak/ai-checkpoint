<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" /> <!-- Deep indigo -->
      <stop offset="100%" stop-color="#050505" /> <!-- Near black -->
    </radialGradient>

    <!-- The Beautiful Neon Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- Cyan -->
      <stop offset="50%" stop-color="#818cf8" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#e879f9" /> <!-- Pink/Purple -->
    </linearGradient>

    <linearGradient id="neon-grad-alt" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Intense Outer Glow -->
    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Core Inner Glow -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-glow)" />
  
  <!-- Subtle Grid Lines for "Code/Tech" feel -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
  </g>

  <!-- Central Glowing Loop / Circuit -->
  <path d="M250 400 C 250 250, 550 250, 550 400 C 550 550, 250 550, 250 400 Z" fill="none" stroke="url(#neon-grad)" stroke-width="20" stroke-linecap="round" filter="url(#intense-glow)" opacity="0.6"/>
  <path d="M250 400 C 250 250, 550 250, 550 400 C 550 550, 250 550, 250 400 Z" fill="none" stroke="url(#neon-grad)" stroke-width="8" stroke-linecap="round" />

  <!-- Code Brackets integrated into the loop -->
  <path d="M300 280 L180 400 L300 520" fill="none" stroke="url(#neon-grad-alt)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#intense-glow)" />
  <path d="M500 280 L620 400 L500 520" fill="none" stroke="url(#neon-grad-alt)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#intense-glow)" />
  
  <!-- The Checkpoint Core -->
  <circle cx="400" cy="400" r="56" fill="url(#neon-grad)" filter="url(#intense-glow)" />
  <circle cx="400" cy="400" r="24" fill="#ffffff" filter="url(#core-glow)" />

  <!-- Sparkles / Particles for Magic effect -->
  <circle cx="280" cy="250" r="6" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="550" cy="300" r="8" fill="#e879f9" filter="url(#core-glow)" />
  <circle cx="320" cy="520" r="5" fill="#818cf8" filter="url(#core-glow)" />
  <circle cx="500" cy="550" r="7" fill="#38bdf8" filter="url(#core-glow)" />
</svg>
