appId: com.khairulistiyak.ai-checkpoint
productName: AI Checkpoint
copyright: Copyright © 2026 Khairul Istiyak

directories:
  output: release
  buildResources: build-resources

asar: false

files:
  - electron/**
  - dashboard/dist/**
  - dashboard/server.js
  - dashboard/package.json
  - dashboard/src/server/**
  - build-resources/**
  - packages/**
  - scripts/**
  - templates/**
  - package.json

extraMetadata:
  main: electron/main.js

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: build-resources/icon.icns

dmg:
  title: AI Checkpoint Installer
  icon: build-resources/icon.icns
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AI Checkpoint

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  synopsis: Deterministic State Ledger & Execution Framework for AI Agents
  description: State ledger, execution engine, and real-time dashboard for autonomous AI coding agents.
  icon: build-resources/icon.png

publish:
  provider: github
  owner: khairulistiyak
  repo: ai-checkpoint
