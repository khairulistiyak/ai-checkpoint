<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1b1c2b" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </radialGradient>
    
    <!-- Theme Gradients -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="neon">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      .dash-flow { stroke-dasharray: 8 16; animation: flow 1s linear infinite; }
      @keyframes flow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
      .pulse { animation: pulse 2s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: 0.7; transform: scale(0.97); } to { opacity: 1; transform: scale(1.03); } }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="850" fill="url(#bg)" />
  
  <!-- Subtle Abstract Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.04" />
  </pattern>
  <rect width="1400" height="850" fill="url(#grid)" />

  <!-- HEADER -->
  <text x="700" y="90" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">How ai-checkpoint Works</text>
  <text x="700" y="135" font-family="'Inter', sans-serif" font-size="22" fill="#a855f7" font-weight="900" text-anchor="middle">Your AI forgets. This doesn't. 🧠</text>
  <text x="700" y="170" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">A zero-dependency CLI that tracks exact progress across your AI coding sessions.</text>

  <!-- CONNECTION PATHS (Animated Data Streams) -->
  <!-- Arrow 1 -> 2 -->
  <path d="M 400,470 C 480,470 500,470 580,470" fill="none" stroke="url(#purple-glow)" stroke-width="6" class="dash-flow" filter="url(#neon)"/>
  <!-- Arrow 2 -> 3 -->
  <path d="M 820,470 C 900,470 920,470 1000,470" fill="none" stroke="url(#blue-glow)" stroke-width="6" class="dash-flow" filter="url(#neon)"/>

  <!-- ================= CARD 1: HUMAN PLANNING ================= -->
  <g transform="translate(100, 260)" filter="url(#shadow)">
    <rect width="300" height="450" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="2" />
    <!-- Header -->
    <rect width="300" height="90" rx="24" fill="#3b82f6" fill-opacity="0.12" />
    <text x="150" y="45" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#60a5fa" text-anchor="middle">1. Human Plans</text>
    <text x="150" y="70" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Write atomic feature steps</text>

    <!-- Markdown File Graphic -->
    <g transform="translate(25, 120)">
      <rect width="250" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <rect x="0" y="0" width="250" height="35" rx="12" fill="#334155" />
      <rect x="0" y="20" width="250" height="15" fill="#334155" /> <!-- corner blend -->
      
      <circle cx="15" cy="17" r="5" fill="#ef4444"/>
      <circle cx="30" cy="17" r="5" fill="#eab308"/>
      <circle cx="45" cy="17" r="5" fill="#22c55e"/>
      <text x="65" y="22" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#cbd5e1">plan/my-feature.md</text>
      
      <!-- Fake Markdown Content -->
      <text x="15" y="65" font-family="'Inter', sans-serif" font-size="15" font-weight="bold" fill="#60a5fa">## Step 1.1: Auth Setup</text>
      <text x="15" y="90" font-family="'Fira Code', monospace" font-size="12" fill="#94a3b8">File: src/auth.ts</text>
      <text x="15" y="110" font-family="'Fira Code', monospace" font-size="12" fill="#94a3b8">Action: Create</text>
      <rect x="15" y="122" width="160" height="18" rx="4" fill="#10b981" fill-opacity="0.1"/>
      <text x="20" y="135" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#34d399">✅ Done: File exported</text>
    </g>

    <!-- Downward Sync Arrow -->
    <g transform="translate(150, 290)">
      <path d="M 0,0 L 0,45" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" />
      <path d="M -6,38 L 0,46 L 6,38" fill="none" stroke="#64748b" stroke-width="2" />
    </g>

    <!-- Agent Context Box -->
    <rect x="30" y="355" width="240" height="40" rx="8" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1.5"/>
    <text x="150" y="379" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">.agents/PROGRESS.md</text>
    
    <text x="150" y="420" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Steps are synced to the ledger</text>
  </g>


  <!-- ================= CARD 2: AI EXECUTION ================= -->
  <g transform="translate(580, 260)" filter="url(#shadow)">
    <rect width="240" height="450" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#a855f7" stroke-width="2.5" />
    <rect width="240" height="90" rx="24" fill="#a855f7" fill-opacity="0.15" />
    
    <text x="120" y="45" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#c084fc" text-anchor="middle">2. AI Executes</text>
    <text x="120" y="70" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Reads context &amp; codes</text>

    <!-- Brain / AI Core Node -->
    <g transform="translate(120, 175)" class="pulse">
      <circle cx="0" cy="0" r="55" fill="url(#purple-glow)" fill-opacity="0.25" filter="url(#neon)"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="10 10"/>
      <text x="0" y="15" font-size="44" text-anchor="middle">🤖</text>
    </g>

    <text x="120" y="275" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Context Loaded</text>
    
    <!-- Loaded files -->
    <rect x="20" y="295" width="200" height="30" rx="6" fill="#1e293b"/>
    <text x="120" y="315" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">✓ AGENTS.md</text>
    
    <rect x="20" y="335" width="200" height="30" rx="6" fill="#1e293b"/>
    <text x="120" y="355" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">✓ PROGRESS.md</text>
    
    <rect x="20" y="375" width="200" height="30" rx="6" fill="#1e293b"/>
    <text x="120" y="395" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">✓ RULES.md</text>
    
    <text x="120" y="430" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">AI knows exactly where to resume</text>
  </g>


  <!-- ================= CARD 3: THE LEDGER (CLI & UI) ================= -->
  <g transform="translate(1000, 260)" filter="url(#shadow)">
    <rect width="300" height="450" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="2.5" />
    <rect width="300" height="90" rx="24" fill="#10b981" fill-opacity="0.15" />
    
    <text x="150" y="45" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#34d399" text-anchor="middle">3. Auto-Verify</text>
    <text x="150" y="70" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">CLI tracks the progress</text>

    <!-- Terminal Command Snippet -->
    <g transform="translate(20, 115)">
      <rect width="260" height="100" rx="10" fill="#000000" stroke="#334155" stroke-width="1.5" />
      <text x="15" y="30" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#60a5fa">$ ./l c 1.1 "auth"</text>
      <text x="15" y="55" font-family="'Fira Code', monospace" font-size="12" fill="#94a3b8">Checking src/auth.ts...</text>
      <rect x="10" y="65" width="240" height="25" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="15" y="82" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#34d399">✅ Step 1.1 Confirmed Done</text>
    </g>

    <!-- Visual UI Dashboard Mockup -->
    <g transform="translate(20, 240)">
      <rect width="260" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <rect width="260" height="35" rx="12" fill="#334155" />
      <rect width="260" height="15" y="20" fill="#334155" />
      
      <text x="130" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Visual Progress Board</text>
      
      <!-- Progress bars -->
      <text x="15" y="65" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Phase 1: Setup</text>
      <rect x="15" y="75" width="230" height="14" rx="7" fill="#0f172a" />
      <rect x="15" y="75" width="230" height="14" rx="7" fill="#10b981" filter="url(#neon)"/>
      <text x="15" y="103" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#10b981">COMPLETE (100%)</text>

      <text x="15" y="132" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Phase 2: Core Logics</text>
      <rect x="15" y="142" width="230" height="14" rx="7" fill="#0f172a" />
      <rect x="15" y="142" width="115" height="14" rx="7" fill="#eab308" filter="url(#neon)"/>
      <text x="15" y="170" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#eab308">ACTIVE (50%)</text>
    </g>
    
    <text x="150" y="425" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Fails safely if file isn't created</text>

  </g>
</svg>
