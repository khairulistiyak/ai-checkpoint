<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Base -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <!-- Gradients -->
    <linearGradient id="glitchGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1F5A" />
      <stop offset="50%" stop-color="#FF5B00" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#8B949E" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="hugeBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="glow30" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <filter id="glow12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Solid Background -->
  <rect width="100%" height="100%" fill="url(#bgBase)" rx="16" />

  <!-- Ambient Background Glows (For depth and glassmorphism feel) -->
  <circle cx="200" cy="230" r="160" fill="#FF1F5A" opacity="0.12" filter="url(#hugeBlur)" />
  <circle cx="600" cy="230" r="160" fill="#00F2FE" opacity="0.12" filter="url(#hugeBlur)" />
  <circle cx="400" cy="230" r="120" fill="#FFFFFF" opacity="0.04" filter="url(#hugeBlur)" />

  <!-- Tech Grid / Minimal Crosshairs -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.15">
    <path d="M 120 100 L 130 100 M 125 95 L 125 105" />
    <path d="M 650 120 L 660 120 M 655 115 L 655 125" />
    <path d="M 150 400 L 160 400 M 155 395 L 155 405" />
    <path d="M 680 380 L 690 380 M 685 375 L 685 385" />
  </g>

  <!-- LOGO MARK -->
  <g transform="translate(0, 0)">
    
    <!-- LEFT ARROW (Fragmented/Restoring) -->
    <g>
      <!-- Deep Glow -->
      <g fill="url(#glitchGrad)" opacity="0.5" filter="url(#glow30)">
        <polygon points="290,130 320,130 250,180 220,180" />
        <polygon points="207,182 237,182 198,210 168,210" />
        <polygon points="181,212 211,212 186,230 211,248 181,248 156,230" />
        <polygon points="164,250 194,250 236,280 206,280" />
        <polygon points="225,282 255,282 322,330 292,330" />
      </g>
      
      <!-- Solid Blocks -->
      <g fill="url(#glitchGrad)">
        <polygon points="290,130 320,130 250,180 220,180" />
        <polygon points="207,182 237,182 198,210 168,210" />
        <polygon points="181,212 211,212 186,230 211,248 181,248 156,230" />
        <polygon points="164,250 194,250 236,280 206,280" />
        <polygon points="225,282 255,282 322,330 292,330" />
        
        <!-- Particles -->
        <polygon points="140,210 148,210 142,218 134,218" />
        <polygon points="120,240 135,240 135,245 120,245" />
        <polygon points="180,290 195,290 185,302 170,302" />
        <polygon points="250,195 260,195 255,202 245,202" />
      </g>

      <!-- Tech Detail Lines -->
      <g stroke="url(#glitchGrad)" stroke-width="1.5" opacity="0.6">
        <line x1="160" y1="175" x2="210" y2="175" />
        <line x1="280" y1="215" x2="330" y2="215" />
        <line x1="130" y1="260" x2="190" y2="260" />
        <line x1="240" y1="300" x2="290" y2="300" />
      </g>
    </g>

    <!-- RIGHT ARROW (Clean/AI) -->
    <g>
      <!-- Huge subtle glow -->
      <path d="M 480 130 L 620 230 L 480 330 L 510 330 L 650 230 L 510 130 Z" fill="url(#aiGrad)" opacity="0.4" filter="url(#glow30)" />
      
      <!-- Solid Body -->
      <path d="M 480 130 L 620 230 L 480 330 L 510 330 L 650 230 L 510 130 Z" fill="url(#aiGrad)" />
      
      <!-- Glass Edge / Rim light -->
      <path d="M 480 130 L 620 230 L 480 330 L 510 330 L 650 230 L 510 130 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" />
    </g>

    <!-- CENTER SPARK (Intelligence) -->
    <g>
      <!-- Spark glow -->
      <path d="M 400 200 Q 400 230 430 230 Q 400 230 400 260 Q 400 230 370 230 Q 400 230 400 200 Z" fill="#FFFFFF" opacity="0.6" filter="url(#glow12)" />
      
      <!-- Spark solid -->
      <path d="M 400 200 Q 400 230 430 230 Q 400 230 400 260 Q 400 230 370 230 Q 400 230 400 200 Z" fill="#FFFFFF" />
      
      <!-- Spark core dot -->
      <circle cx="400" cy="230" r="4" fill="#00F2FE" />
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="400" y="440" font-size="56" letter-spacing="4">
      <tspan font-weight="800" fill="#FFFFFF">CODE </tspan>
      <tspan font-weight="300" fill="url(#textGrad)">RESTORE</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="400" y="485" font-size="14" font-weight="600" fill="#6A7A8C" letter-spacing="12">SMART AI CODE CORRECTION</text>
  </g>
</svg>
