<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Outfit', sans-serif">
  <defs>
    <!-- Background mesh & gradients -->
    <radialGradient id="meshGradient1" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGradient2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glass & Card Linear Gradients -->
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    text { fill: #ffffff; }
    .font-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .font-black { font-weight: 900; }
    .text-dim { fill: #71717a; }
    .text-sub { fill: #a1a1aa; }
    .text-sky { fill: #38bdf8; }
    .text-emerald { fill: #34d399; }
    .text-purple { fill: #c084fc; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1400" height="900" fill="#040508" />
  <rect width="1400" height="900" fill="url(#meshGradient1)" />
  <rect width="1400" height="900" fill="url(#meshGradient2)" />

  <!-- Background Grid Pattern -->
  <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" />
  </pattern>
  <rect width="1400" height="900" fill="url(#bgGrid)" />

  <!-- ═════════════════════════════════════════════════════════════ -->
  <!-- MAIN APPLICATION WINDOW -->
  <!-- ═════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 30)" filter="url(#shadowHeavy)">
    <!-- Window Outer Shell -->
    <rect width="1340" height="840" rx="20" fill="#0b0c12" stroke="url(#windowBorder)" stroke-width="1.5" />

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- WINDOW HEADER / TITLEBAR -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <!-- macOS Traffic Lights -->
      <g transform="translate(24, 20)">
        <circle cx="0" cy="0" r="6" fill="#ff5f56" />
        <circle cx="18" cy="0" r="6" fill="#ffbd2e" />
        <circle cx="36" cy="0" r="6" fill="#27c93f" />
      </g>

      <!-- Brand & Project Switcher -->
      <g transform="translate(100, 10)">
        <rect width="210" height="34" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="url(#cardBorder)" />
        <circle cx="16" cy="17" r="4" fill="#38bdf8" />
        <text x="28" y="22" font-size="13" class="font-bold">ai-checkpoint</text>
        <rect x="135" y="7" width="62" height="20" rx="6" fill="#38bdf8" fill-opacity="0.15" />
        <text x="166" y="21" font-size="10" class="font-mono font-bold text-sky" text-anchor="middle">ACTIVE</text>
      </g>

      <!-- Live Watcher Pill -->
      <g transform="translate(330, 10)">
        <rect width="185" height="34" rx="10" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.25" />
        <circle cx="16" cy="17" r="4" fill="#34d399" />
        <text x="28" y="22" font-size="12" class="font-mono text-emerald">👁️ Live Watcher (Active)</text>
      </g>

      <!-- Right Header Actions -->
      <g transform="translate(1010, 10)">
        <!-- Command Palette -->
        <rect width="160" height="34" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="url(#cardBorder)" />
        <text x="16" y="22" font-size="12" class="text-sub font-mono">⌘K Commands</text>
        <!-- AI Tier Pill -->
        <rect x="175" y="0" width="130" height="34" rx="10" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-opacity="0.3" />
        <text x="240" y="22" font-size="11" class="font-mono font-bold text-purple" text-anchor="middle">⚡ Small (Tier 1)</text>
      </g>

      <line x1="0" y1="56" x2="1340" y2="56" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
    </g>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- 4-TAB NAVIGATION BAR -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(30, 72)">
      <!-- Tab 1: Cockpit Overview (ACTIVE) -->
      <g>
        <rect width="180" height="38" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
        <circle cx="20" cy="19" r="4" fill="#38bdf8" />
        <text x="32" y="24" font-size="13" class="font-bold text-sky">Cockpit Overview</text>
        <rect x="150" y="9" width="18" height="20" rx="4" fill="#000000" fill-opacity="0.4" />
        <text x="159" y="23" font-size="10" class="font-mono text-dim" text-anchor="middle">1</text>
      </g>

      <!-- Tab 2: Roadmap & Steps -->
      <g transform="translate(195, 0)">
        <rect width="180" height="38" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
        <text x="24" y="24" font-size="13" class="text-sub font-semibold">Roadmap &amp; Steps</text>
        <rect x="150" y="9" width="18" height="20" rx="4" fill="#000000" fill-opacity="0.3" />
        <text x="159" y="23" font-size="10" class="font-mono text-dim" text-anchor="middle">2</text>
      </g>

      <!-- Tab 3: Plan Blueprints -->
      <g transform="translate(390, 0)">
        <rect width="180" height="38" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
        <text x="24" y="24" font-size="13" class="text-sub font-semibold">Plan Blueprints</text>
        <rect x="150" y="9" width="18" height="20" rx="4" fill="#000000" fill-opacity="0.3" />
        <text x="159" y="23" font-size="10" class="font-mono text-dim" text-anchor="middle">3</text>
      </g>

      <!-- Tab 4: Workflows & CLI -->
      <g transform="translate(585, 0)">
        <rect width="180" height="38" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
        <text x="24" y="24" font-size="13" class="text-sub font-semibold">Workflows &amp; CLI</text>
        <rect x="150" y="9" width="18" height="20" rx="4" fill="#000000" fill-opacity="0.3" />
        <text x="159" y="23" font-size="10" class="font-mono text-dim" text-anchor="middle">4</text>
      </g>
    </g>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- 4 PULSE KPI CARDS -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(30, 126)">
      <!-- KPI 1: Health Fortress -->
      <g>
        <rect width="305" height="120" rx="16" fill="#12131a" stroke="url(#cardBorder)" />
        <text x="20" y="32" font-size="11" class="font-mono font-bold text-sub" letter-spacing="0.5">HEALTH FORTRESS</text>
        <text x="20" y="76" font-size="36" class="font-black text-emerald">100<tspan font-size="18" class="text-dim">/100</tspan></text>
        <rect x="20" y="90" width="150" height="18" rx="6" fill="#10b981" fill-opacity="0.12" />
        <text x="28" y="103" font-size="10" class="font-mono text-emerald">✔ 0 Syntax • 0 Leaks</text>
      </g>

      <!-- KPI 2: Code Quality -->
      <g transform="translate(325, 0)">
        <rect width="305" height="120" rx="16" fill="#12131a" stroke="url(#cardBorder)" />
        <text x="20" y="32" font-size="11" class="font-mono font-bold text-sub" letter-spacing="0.5">ARCHITECTURE QUALITY</text>
        <text x="20" y="76" font-size="36" class="font-black text-sky">85<tspan font-size="18" class="text-dim">/100</tspan></text>
        <rect x="20" y="90" width="155" height="18" rx="6" fill="#38bdf8" fill-opacity="0.12" />
        <text x="28" y="103" font-size="10" class="font-mono text-sky">✔ Structure OK • Clean</text>
      </g>

      <!-- KPI 3: State Machine Velocity -->
      <g transform="translate(650, 0)">
        <rect width="305" height="120" rx="16" fill="#12131a" stroke="url(#cardBorder)" />
        <text x="20" y="32" font-size="11" class="font-mono font-bold text-sub" letter-spacing="0.5">STATE MACHINE VELOCITY</text>
        <text x="20" y="76" font-size="36" class="font-black text-purple">100<tspan font-size="22" class="font-bold text-purple">%</tspan></text>
        <rect x="20" y="90" width="165" height="18" rx="6" fill="#a855f7" fill-opacity="0.12" />
        <text x="28" y="103" font-size="10" class="font-mono text-purple">✔ 460/460 Steps Verified</text>
      </g>

      <!-- KPI 4: Rule 0 Guard -->
      <g transform="translate(975, 0)">
        <rect width="305" height="120" rx="16" fill="#12131a" stroke="url(#cardBorder)" />
        <text x="20" y="32" font-size="11" class="font-mono font-bold text-sub" letter-spacing="0.5">RULE 0 MICRO-FILE GUARD</text>
        <text x="20" y="76" font-size="34" class="font-black">≤ 150 <tspan font-size="14" class="text-dim">lines</tspan></text>
        <rect x="20" y="90" width="170" height="18" rx="6" fill="#34d399" fill-opacity="0.12" />
        <text x="28" y="103" font-size="10" class="font-mono text-emerald">✔ 0 Monolithic Files (100%)</text>
      </g>
    </g>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- SPLIT CONTENT: CAD PLAN BLUEPRINT & TERMINAL STREAM -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(30, 262)">
      <!-- LEFT: ARCHITECTURAL PLAN BLUEPRINTS -->
      <g>
        <rect width="680" height="530" rx="18" fill="#101118" stroke="url(#cardBorder)" />
        
        <!-- Header -->
        <g transform="translate(24, 24)">
          <text font-size="16" class="font-bold">Architectural Blueprint &amp; Execution Queue</text>
          <text y="22" font-size="12" class="text-sub font-mono">Plan: phase-71-svg-mockup-realignment.md</text>
        </g>

        <!-- Step 71.1 (Completed) -->
        <g transform="translate(24, 80)">
          <rect width="632" height="96" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
          <circle cx="32" cy="48" r="14" fill="#10b981" fill-opacity="0.2" />
          <path d="M 26 48 L 30 52 L 38 44" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
          <text x="60" y="38" font-size="14" class="font-bold">Step 71.1 — Reconstruct Hero Showcase Banner</text>
          <text x="60" y="60" font-size="12" class="font-mono text-sub">File: ui-mockup-colorful.svg</text>
          <rect x="60" y="70" width="80" height="18" rx="5" fill="#10b981" fill-opacity="0.15" />
          <text x="100" y="83" font-size="10" class="font-mono font-bold text-emerald" text-anchor="middle">DONE [x]</text>
        </g>

        <!-- Step 71.2 (Active / Running) -->
        <g transform="translate(24, 190)">
          <rect width="632" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
          <circle cx="32" cy="48" r="14" fill="#0284c7" fill-opacity="0.3" />
          <circle cx="32" cy="48" r="6" fill="#38bdf8" />
          <text x="60" y="38" font-size="14" class="font-bold text-sky">Step 71.2 — Reconstruct Multi-Workspace Control Room</text>
          <text x="60" y="60" font-size="12" class="font-mono text-sub">File: ui-mockup-multiproject.svg</text>
          <rect x="60" y="70" width="90" height="18" rx="5" fill="#38bdf8" fill-opacity="0.2" />
          <text x="105" y="83" font-size="10" class="font-mono font-bold text-sky" text-anchor="middle">RUNNING [/]</text>
        </g>

        <!-- Step 71.3 (Pending) -->
        <g transform="translate(24, 300)">
          <rect width="632" height="96" rx="14" fill="#ffffff" fill-opacity="0.015" stroke="url(#cardBorder)" />
          <circle cx="32" cy="48" r="14" fill="#ffffff" fill-opacity="0.05" />
          <circle cx="32" cy="48" r="4" fill="#71717a" />
          <text x="60" y="38" font-size="14" class="font-bold text-sub">Step 71.3 — Full Verification &amp; README Sync</text>
          <text x="60" y="60" font-size="12" class="font-mono text-dim">File: .agents/PROGRESS.md</text>
          <rect x="60" y="70" width="80" height="18" rx="5" fill="#ffffff" fill-opacity="0.05" />
          <text x="100" y="83" font-size="10" class="font-mono text-dim" text-anchor="middle">PENDING [ ]</text>
        </g>

        <!-- CAD Mini Flow Chart -->
        <g transform="translate(24, 415)">
          <rect width="632" height="90" rx="12" fill="#000000" fill-opacity="0.4" stroke="url(#cardBorder)" />
          <text x="20" y="28" font-size="11" class="font-mono text-sub">DETERMINISTIC CAD FLOW</text>
          <g transform="translate(20, 42)">
            <rect width="110" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
            <text x="55" y="20" font-size="11" class="font-mono text-emerald" text-anchor="middle">./l start</text>
            
            <line x1="120" y1="16" x2="160" y2="16" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4" />
            
            <rect x="170" width="110" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
            <text x="225" y="20" font-size="11" class="font-mono text-sky" text-anchor="middle">./l v</text>
            
            <line x1="290" y1="16" x2="330" y2="16" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4" />
            
            <rect x="340" width="110" height="32" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" />
            <text x="395" y="20" font-size="11" class="font-mono text-purple" text-anchor="middle">./l c</text>
            
            <line x1="460" y1="16" x2="500" y2="16" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4" />
            
            <rect x="510" width="90" height="32" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" />
            <text x="555" y="20" font-size="11" class="font-mono text-amber-400" text-anchor="middle">./l cp</text>
          </g>
        </g>
      </g>

      <!-- RIGHT: STREAMING TERMINAL LOGS & HEALTH GATE -->
      <g transform="translate(700, 0)">
        <rect width="580" height="530" rx="18" fill="#07080d" stroke="url(#cardBorder)" />
        
        <!-- Terminal Header -->
        <g transform="translate(20, 20)">
          <circle cx="0" cy="0" r="4" fill="#38bdf8" />
          <text x="14" y="4" font-size="13" class="font-mono font-bold">STREAMING TERMINAL &amp; HEALTH GATE</text>
          <line x1="0" y1="18" x2="540" y2="18" stroke="#ffffff" stroke-opacity="0.06" />
        </g>

        <!-- Terminal Output -->
        <g transform="translate(20, 60)" class="font-mono" font-size="12">
          <text y="0" class="text-sub">$ ./l start 71.1</text>
          <text y="24" class="text-sky">ℹ Initializing Step 71.1...</text>
          <text y="48" class="text-sub">✔ Step 71.1 initialized [~]</text>
          
          <text y="84" class="text-sub">$ ./l v</text>
          <text y="108" class="text-emerald">✔ Validation passed: Rule 0 compliance (100%)</text>
          <text y="132" class="text-emerald">✔ Verified: ui-mockup-colorful.svg</text>
          
          <text y="168" class="text-sub">$ ./l health</text>
          <text y="192" class="text-emerald">┌────────────────────────────────────────────────┐</text>
          <text y="212" class="text-emerald">│  🛡️  Project Health Score: 100/100 (HEALTHY)   │</text>
          <text y="232" class="text-emerald">└────────────────────────────────────────────────┘</text>
          <text y="252" class="text-sub">Breakdown: 0 Syntax Errors • 0 Broken Imports</text>
          
          <text y="288" class="text-sub">$ ./l c 71.1 "Reconstructed Hero Showcase Banner"</text>
          <text y="312" class="text-emerald font-bold">🎉 STEP 71.1 COMPLETED! (461/462)</text>
          <text y="336" class="text-purple">👉 NEXT: Step 71.2 — Reconstruct Multi-Workspace Control Room</text>
          
          <text y="372" class="text-sub">$ ./l start 71.2</text>
          <!-- Terminal Blinking Cursor -->
          <rect x="125" y="360" width="8" height="15" fill="#38bdf8" />
        </g>

        <!-- Dock at bottom right -->
        <g transform="translate(20, 460)">
          <rect width="540" height="50" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="url(#cardBorder)" />
          <text x="20" y="30" font-size="12" class="font-mono text-sub">Developer Action Dock</text>
          
          <g transform="translate(200, 10)">
            <rect width="100" height="30" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
            <text x="50" y="19" font-size="11" class="font-mono font-bold text-sky" text-anchor="middle">Execute Next</text>
            
            <rect x="110" width="100" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="url(#cardBorder)" />
            <text x="160" y="19" font-size="11" class="font-mono text-sub" text-anchor="middle">Validate All</text>

            <rect x="220" width="100" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="url(#cardBorder)" />
            <text x="270" y="19" font-size="11" class="font-mono text-sub" text-anchor="middle">Health Audit</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
