<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Outfit', sans-serif">
  <defs>
    <!-- Dark base background with subtle gradient -->
    <rect id="bg" width="1400" height="900" fill="#07080c" />
    
    <radialGradient id="meshLeft" cx="10%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshRight" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    text { fill: #ffffff; }
    .font-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .font-black { font-weight: 900; }
    .text-dim { fill: #71717a; }
    .text-sub { fill: #a1a1aa; }
    .text-sky { fill: #38bdf8; }
    .text-emerald { fill: #34d399; }
    .text-purple { fill: #c084fc; }
    .text-amber { fill: #fbbf24; }
  </style>

  <!-- Background Canvas -->
  <use href="#bg" />
  <rect width="1400" height="900" fill="url(#meshLeft)" />
  <rect width="1400" height="900" fill="url(#meshRight)" />

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" />
  </pattern>
  <rect width="1400" height="900" fill="url(#grid)" />

  <!-- ═════════════════════════════════════════════════════════════ -->
  <!-- MAIN WINDOW SHELL -->
  <!-- ═════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 30)" filter="url(#shadowHeavy)">
    <rect width="1340" height="840" rx="20" fill="#0b0c12" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- LEFT SIDEBAR: MULTI-WORKSPACE HUB -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <rect width="320" height="840" rx="20" fill="#0e0f17" />
      <line x1="320" y1="0" x2="320" y2="840" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

      <!-- Traffic Lights -->
      <g transform="translate(24, 24)">
        <circle cx="0" cy="0" r="6" fill="#ff5f56" />
        <circle cx="18" cy="0" r="6" fill="#ffbd2e" />
        <circle cx="36" cy="0" r="6" fill="#27c93f" />
      </g>

      <!-- Brand -->
      <g transform="translate(24, 60)">
        <text font-size="18" class="font-black tracking-tight">AI Checkpoint</text>
        <text y="20" font-size="11" class="font-mono text-dim">Multi-Workspace Ledger v2.0</text>
      </g>

      <!-- Track Workspace Button (Phase 70) -->
      <g transform="translate(20, 106)">
        <rect width="280" height="38" rx="10" fill="url(#primaryGrad)" />
        <text x="140" y="24" font-size="13" class="font-bold" text-anchor="middle">➕ Track New Workspace</text>
      </g>

      <!-- Workspace List Section -->
      <g transform="translate(20, 170)">
        <text font-size="11" class="font-mono font-bold text-dim" letter-spacing="0.5">REGISTERED WORKSPACES (4)</text>

        <!-- Project 1: ai-checkpoint (ACTIVE) -->
        <g transform="translate(0, 16)">
          <rect width="280" height="74" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
          <circle cx="20" cy="26" r="4" fill="#34d399" />
          <text x="32" y="30" font-size="14" class="font-bold">ai-checkpoint</text>
          <text x="260" y="30" font-size="12" class="font-mono font-bold text-emerald" text-anchor="end">100%</text>
          <text x="20" y="52" font-size="11" class="font-mono text-dim">/Volumes/SSD/0.1/ai-checkpoint</text>
          <rect x="20" y="60" width="240" height="4" rx="2" fill="#000000" fill-opacity="0.5" />
          <rect x="20" y="60" width="240" height="4" rx="2" fill="#34d399" />
        </g>

        <!-- Project 2: pixel-gemini -->
        <g transform="translate(0, 100)">
          <rect width="280" height="74" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
          <circle cx="20" cy="26" r="4" fill="#34d399" />
          <text x="32" y="30" font-size="14" class="font-semibold text-sub">pixel-gemini</text>
          <text x="260" y="30" font-size="12" class="font-mono text-dim" text-anchor="end">100%</text>
          <text x="20" y="52" font-size="11" class="font-mono text-dim">/Volumes/SSD/2026/pixel-gemini</text>
          <rect x="20" y="60" width="240" height="4" rx="2" fill="#000000" fill-opacity="0.5" />
          <rect x="20" y="60" width="240" height="4" rx="2" fill="#34d399" />
        </g>

        <!-- Project 3: google_offers_terminal -->
        <g transform="translate(0, 184)">
          <rect width="280" height="74" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
          <circle cx="20" cy="26" r="4" fill="#38bdf8" />
          <text x="32" y="30" font-size="14" class="font-semibold text-sub">google_offers</text>
          <text x="260" y="30" font-size="12" class="font-mono text-sky" text-anchor="end">85%</text>
          <text x="20" y="52" font-size="11" class="font-mono text-dim">/Volumes/SSD/2026/google_offers</text>
          <rect x="20" y="60" width="240" height="4" rx="2" fill="#000000" fill-opacity="0.5" />
          <rect x="20" y="60" width="204" height="4" rx="2" fill="#38bdf8" />
        </g>

        <!-- Project 4: imran_agro_02 -->
        <g transform="translate(0, 268)">
          <rect width="280" height="74" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
          <circle cx="20" cy="26" r="4" fill="#fbbf24" />
          <text x="32" y="30" font-size="14" class="font-semibold text-sub">imran_agro_02</text>
          <text x="260" y="30" font-size="12" class="font-mono text-amber" text-anchor="end">54%</text>
          <text x="20" y="52" font-size="11" class="font-mono text-dim">/Volumes/SSD/2026/imran_agro_02</text>
          <rect x="20" y="60" width="240" height="4" rx="2" fill="#000000" fill-opacity="0.5" />
          <rect x="20" y="60" width="130" height="4" rx="2" fill="#fbbf24" />
        </g>
      </g>

      <!-- Bottom System Status -->
      <g transform="translate(20, 770)">
        <rect width="280" height="46" rx="10" fill="#000000" fill-opacity="0.4" stroke="url(#cardBorder)" />
        <circle cx="16" cy="23" r="4" fill="#34d399" />
        <text x="28" y="28" font-size="11" class="font-mono text-sub">Backend Server: Port 20226</text>
      </g>
    </g>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- RIGHT MAIN CONTENT (ACTIVE WORKSPACE) -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(320, 0)">
      
      <!-- Top Title Bar -->
      <g transform="translate(30, 20)">
        <text font-size="22" class="font-bold">ai-checkpoint</text>
        
        <!-- Path Badge -->
        <rect x="170" y="-4" width="250" height="28" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="url(#cardBorder)" />
        <text x="182" y="15" font-size="11" class="font-mono text-sub">📁 /Volumes/SSD/0.1/ai-checkpoint</text>

        <!-- Health Badge -->
        <rect x="430" y="-4" width="130" height="28" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" />
        <text x="495" y="15" font-size="11" class="font-mono font-bold text-emerald" text-anchor="middle">🛡️ Health 100/100</text>

        <!-- AI Tier Badge -->
        <rect x="570" y="-4" width="120" height="28" rx="8" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.3" />
        <text x="630" y="15" font-size="11" class="font-mono font-bold text-purple" text-anchor="middle">⚡ Tier: Small</text>

        <!-- 4-Tab Navigation on the right -->
        <g transform="translate(710, -4)">
          <rect width="90" height="28" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.5" />
          <text x="45" y="15" font-size="11" class="font-mono font-bold text-sky" text-anchor="middle">Cockpit</text>

          <rect x="96" width="90" height="28" rx="6" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
          <text x="141" y="15" font-size="11" class="font-mono text-dim" text-anchor="middle">Roadmap</text>

          <rect x="192" width="90" height="28" rx="6" fill="#ffffff" fill-opacity="0.02" stroke="url(#cardBorder)" />
          <text x="237" y="15" font-size="11" class="font-mono text-dim" text-anchor="middle">Blueprints</text>
        </g>

        <line x1="-30" y1="44" x2="1020" y2="44" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
      </g>

      <!-- ─────────────────────────────────────────────────────────── -->
      <!-- SPLIT: STATE LEDGER DIRECTORY & LIVE TERMINAL STREAM -->
      <!-- ─────────────────────────────────────────────────────────── -->
      <g transform="translate(30, 90)">
        
        <!-- Left Subpanel: Real Directory & File Structure -->
        <g>
          <text font-size="13" class="font-mono font-bold text-sub">WORKSPACE STATE MACHINE (.agents &amp; plan)</text>
          <rect y="16" width="440" height="540" rx="14" fill="#0f1017" stroke="url(#cardBorder)" />
          
          <g transform="translate(20, 44)" class="font-mono" font-size="12">
            <text y="0" class="text-sky font-bold">📁 .agents/</text>
            <text x="20" y="24" class="text-sub">📄 AGENTS.md (Workflow Rules)</text>
            <text x="20" y="48" class="text-sub">📄 RULES.md (Rule 0 &amp; Conventions)</text>
            <text x="20" y="72" class="text-emerald font-bold">📄 PROGRESS.md (460/460 Steps Done)</text>
            <text x="20" y="96" class="text-sub">📄 SYSTEM_GUIDE.md (Architecture)</text>

            <text y="136" class="text-purple font-bold">📁 plan/</text>
            <text x="20" y="160" class="text-sub">📝 phase-69-inmemory-syntax-scanner.md <tspan fill="#34d399">✓</tspan></text>
            <text x="20" y="184" class="text-sub">📝 phase-70-smart-new-project-modal.md <tspan fill="#34d399">✓</tspan></text>
            <text x="20" y="208" class="text-sky font-bold">📝 phase-71-svg-mockup-realignment.md ⏳</text>
            <text x="20" y="232" class="text-dim">📁 drafts/ (Safe Sandboxed Plans)</text>

            <text y="272" class="text-sub font-bold">📁 packages/</text>
            <text x="20" y="296" class="text-sub">📁 core/ (Workspace Scanner &amp; State)</text>
            <text x="20" y="320" class="text-sub">📁 cli/ (Deterministic Step Engine)</text>

            <text y="360" class="text-sub font-bold">📁 dashboard/</text>
            <text x="20" y="384" class="text-sub">📁 src/components/ (Studio UI Modules)</text>
            <text x="20" y="408" class="text-sub">📁 src/server/ (Express &amp; In-Memory V8)</text>

            <text y="448" class="text-emerald">✔ Rule 0 Check: 0 Monolithic Files (&gt;150 lines)</text>
            <text y="472" class="text-emerald">✔ In-Memory Syntax Check: 100/100 HEALTHY</text>
          </g>
        </g>

        <!-- Right Subpanel: Live Realtime Execution Terminal -->
        <g transform="translate(460, 0)">
          <text font-size="13" class="font-mono font-bold text-sub">TERMINAL STREAMING (~/ai-checkpoint)</text>
          <rect y="16" width="500" height="540" rx="14" fill="#050608" stroke="url(#cardBorder)" />

          <g transform="translate(20, 44)" class="font-mono" font-size="12">
            <text y="0" class="text-sub">$ ./l start 71.2</text>
            <text y="24" class="text-sky">ℹ Initializing Step 71.2...</text>
            <text y="48" class="text-sub">ℹ Found in: plan/phase-71-svg-mockup-realignment.md</text>
            <text y="72" class="text-emerald">✔ Step 71.2 initialized [~]</text>

            <text y="108" class="text-sub">$ ./l v</text>
            <text y="132" class="text-emerald">┌──────────────────────────────────────────────┐</text>
            <text y="152" class="text-emerald">│ VALIDATING PROJECT                           │</text>
            <text y="172" class="text-emerald">└──────────────────────────────────────────────┘</text>
            <text y="192" class="text-emerald">✔ Validation passed (0 errors)</text>
            <text y="212" class="text-emerald">✔ Verified: ui-mockup-multiproject.svg</text>

            <text y="248" class="text-sub">$ ./l c 71.2 "Reconstructed Multi-Workspace SVG"</text>
            <text y="272" class="text-emerald font-bold">🎉 STEP 71.2 COMPLETED!</text>
            <text y="296" class="text-purple">📊 Progress: 462/463 steps (100%)</text>
            <text y="320" class="text-purple">👉 NEXT: Step 71.3 — Full Verification Suite</text>

            <text y="356" class="text-sub">$ ./l cp save "Phase 71 Mockups Complete"</text>
            <text y="380" class="text-emerald">✔ Created Git checkpoint: aicp/71.2-1</text>

            <text y="416" class="text-sub">$ ./l _</text>
            <!-- Cursor -->
            <rect x="68" y="406" width="8" height="14" fill="#38bdf8" />
          </g>
        </g>
      </g>

      <!-- Bottom Workspace Action Bar -->
      <g transform="translate(30, 670)">
        <rect width="960" height="80" rx="14" fill="#12131b" stroke="url(#cardBorder)" />
        
        <g transform="translate(24, 22)">
          <text font-size="13" class="font-bold">Multi-Ecosystem Script Runners &amp; Quick Controls</text>
          <text y="22" font-size="11" class="font-mono text-dim">Auto-detected Node, Bats, Vite, and Electron workflows</text>
        </g>

        <g transform="translate(500, 24)">
          <rect width="105" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="url(#cardBorder)" />
          <text x="52" y="22" font-size="11" class="font-mono text-sub" text-anchor="middle">npm test</text>

          <rect x="115" width="105" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="url(#cardBorder)" />
          <text x="167" y="22" font-size="11" class="font-mono text-sub" text-anchor="middle">./l doctor</text>

          <rect x="230" width="105" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="url(#cardBorder)" />
          <text x="282" y="22" font-size="11" class="font-mono text-sub" text-anchor="middle">./l quality</text>

          <rect x="345" width="105" height="34" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
          <text x="397" y="22" font-size="11" class="font-mono font-bold text-sky" text-anchor="middle">./l cp save</text>
        </g>
      </g>

    </g>
  </g>
</svg>
